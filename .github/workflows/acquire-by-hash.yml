name: Set Acquire-By-Hash

# Turns Acquire-By-Hash on or off for published suites. Re-signs each suite it
# touches, which is why it runs here rather than on a laptop.
#
# Run once per suite you want changed. The flag persists in aptly's database,
# and ordinary ingests keep it, so this is not part of the publish path.

on:
  workflow_dispatch:
    inputs:
      state:
        description: Turn Acquire-By-Hash on or off
        required: true
        default: 'on'
        type: choice
        options: ['on', 'off']
      suites:
        description: Space-separated suites, or blank for all three
        required: false
        default: ''

permissions:
  contents: read

# archive-write, not `ingest`: this re-signs the publish points through
# aptly's API and must not run under an ingest. See ingest.yml.
concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch aptly state
        uses: ./.github/actions/fetch-state-branch
        with:
          branch: aptly
          path: aptly-state

      - name: Install aptly
        uses: ./.github/actions/install-aptly

      - name: Import the archive signing key
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
        run: |
          printf '%s' "$ARCHIVE_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Set the flag
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.PKGHAUS_APT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PKGHAUS_APT_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          STATE: ${{ inputs.state }}
          SUITES_IN: ${{ inputs.suites }}
        run: |
          # Deliberate word splitting: SUITES_IN is a space-separated list, and
          # empty means all three.
          # shellcheck disable=SC2086
          scripts/acquire-by-hash.sh "$STATE" $SUITES_IN

      - name: Discard what the aptly branch must not carry
        run: |
          rm -f aptly-state/aptly.conf
          rm -rf aptly-state/pool

      - name: Commit aptly state
        uses: pkghaus/signed-commit@v1
        with:
          workdir: aptly-state
          branch: aptly
          message: Acquire-By-Hash ${{ inputs.state }}
          token: ${{ github.token }}

      - name: Purge the metadata from the edge
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.PKGHAUS_APT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PKGHAUS_APT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PKGHAUS_APT_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        # dists/ is served no-cache, so this is belt to that brace.
        run: scripts/purge-cache.sh
