name: Deploy the archive worker

# pkghaus-archive puts pool/ and dists/ on the network out of R2 and writes the
# download counters. It lives here rather than in pkghaus/stats because this is
# the repository that owns the archive: the same ingest that publishes objects
# to the bucket should be what deploys the thing that serves them.

on:
  push:
    branches: [master]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

# Shared with every workflow that writes the archive; see ingest.yml for the
# full list and why the name is what it is.
concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the archive tree
        working-directory: .
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # The Worker serves this tree as static assets. Deploying without it
        # uploads zero assets. While the routes are narrow that degrades to
        # Pages, but once they are broad it empties the site, so the test
        # below fails the job rather than publishing an empty asset set.
        run: |
          git clone --branch archive --single-branch --depth 1 "$REPO_URL" public
          test -f public/index.html
          # Everything under public/ is published as an asset. Nothing in this
          # workflow commits, so the clone's metadata goes immediately.
          rm -rf public/.git

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # wrangler is a pinned devDependency, not `npx wrangler@4`. It runs with
      # a token that can deploy the Worker serving the archive, so the code it
      # executes has to be the code the lockfile names.
      - name: Install
        run: npm ci

      - name: Syntax-check the worker
        run: node --check src/worker.js

      - name: Test
        run: npm test

      # Resolve, never create. A missing production database is an incident,
      # not something a deploy quietly repairs.
      - name: Resolve the D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_APT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "pkghaus-stats") | .uuid')"
          if [ -z "$id" ]; then
            echo "::error title=D1 database missing::pkghaus-stats does not exist in this account."
            exit 1
          fi
          sed -i "s/PLACEHOLDER_RESOLVED_IN_CI/$id/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_APT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
