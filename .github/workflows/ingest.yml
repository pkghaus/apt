name: Ingest and publish

# Dispatch runs are named after the package that cued them; every other
# event keeps GitHub's default title (the empty fallback string does that).
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('Ingest {0} {1}', github.event.client_payload.repository, github.event.client_payload.tag)
      || '' }}

# Builds whatever the fleet's newest tags provide that the archive does not yet
# carry, includes it into the aptly pool, and publishes dists/ and pool/ to the
# R2 bucket behind https://apt.pkg.haus.
#
# Published pool files are immutable: the plan only ever adds missing versions.
# A run with nothing missing publishes nothing and touches nothing.
#
# State model, two branches, neither served directly:
#   `archive` -- the human-facing tree (listings, news, keyring); cloned into
#                public/, committed back, and uploaded as the Worker's static
#                assets, which is how apt.pkg.haus serves it.
#   `aptly`   -- aptly's leveldb and its local pool; cloned into aptly-state/,
#                committed back. Kept off the archive branch because that whole
#                branch becomes the published asset set.
#
# Runs when pkghaus/packages reports a validated tag (repository_dispatch from
# action-debian-build's notify job), on manual dispatch, and on pushes that
# change the archive's own configuration.
#
# Enrolment is no longer a trigger here: packages.txt lives in pkghaus/packages.
# Enrolling a package takes effect on the next ingest, and the tag that releases
# it dispatches one.

on:
  repository_dispatch:
    types: [package-tagged]
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - scripts/**
      # Every composite action, not install-aptly by name. Both of them are the
      # ingest's own machinery -- fetch-state-branch restores the databases this
      # run reads -- and naming one meant a change to the other did not re-run
      # the thing it changed.
      - .github/actions/**
  # Read-only. The plan job clones both state branches, installs aptly and asks
  # it what the archive already carries; nothing downstream of it runs on a pull
  # request. It exists because CI here was one lint job while five of the seven
  # workflows never executed on a pull request at all -- including this one, the
  # most intricate of them. A composite action that failed to clone, or a plan()
  # that stopped planning, would have been caught by someone reading the diff or
  # not at all.
  #
  # ingest.yml itself is in the paths, so a change to these very gates is
  # exercised by the pull request that makes it.
  pull_request:
    paths:
      - scripts/**
      - .github/actions/**
      - .github/workflows/ingest.yml

permissions:
  contents: read

# Everything that writes the archive shares this group: this workflow,
# deploy-worker.yml, seed-aptly.yml, acquire-by-hash.yml and prune.yml. Two of
# them interleaving would race the archive and aptly branches, the R2 bucket,
# or the Worker deploy. One at a time, never cancelled mid-publish.
#
# Group names are global across workflows, so the string is the coupling and
# renaming it is how the coupling gets broken. It was: this workflow moved from
# `ingest` to `deploy-archive-worker` when it started deploying the Worker, and
# seed-aptly and acquire-by-hash stayed behind on a group nothing else used.
# For as long as that lasted, a hand-fired seed could republish the archive
# underneath a running ingest. The name says what it guards now, not which
# workflow happened to claim it first.
#
# A pull-request plan takes a group of its own. It must not hold archive-write:
# that would queue every pull request behind a running ingest and, far worse,
# queue real ingests behind pull requests. Cancellable, because only the newest
# push to a branch is worth planning.
#
# `a && b || c` is the shape that has misfired twice in this estate, because it
# yields c whenever b is falsy. It is safe here and only here: b is a format()
# that always returns a non-empty string, so it can never be the falsy branch.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ingest-plan-{0}', github.ref)
        || 'archive-write' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout the packages
        uses: actions/checkout@v7
        with:
          repository: pkghaus/packages
          path: packages
          persist-credentials: false

      - name: Check signing-key expiry
        # Not on a pull request: it reads the exported private key material and
        # fails hard without it, so it cannot run where secrets are absent. It
        # is also not what a pull request is here to exercise.
        if: github.event_name != 'pull_request'
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
        run: scripts/check-key-expiry.sh

      # What the archive already carries is a database question, so the plan
      # job needs the database and nothing else.
      - name: Fetch aptly state
        uses: ./.github/actions/fetch-state-branch
        with:
          branch: aptly
          path: aptly-state

      - name: Install aptly
        uses: ./.github/actions/install-aptly

      - name: Plan
        id: plan
        # The matrix fans out one leg per plan row (package x suite x arch),
        # so each leg's artifact can carry the real package filename.
        env:
          # Enrolment lives with the packages, not with the archive.
          PACKAGES_FILE: packages/packages.txt
        run: |
          scripts/ingest.sh plan > plan.tsv
          echo "--- plan ---"
          column -t -s "$(printf '\t')" plan.tsv || true

          if [ -s plan.tsv ]; then
              echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
              echo "has_work=false" >> "$GITHUB_OUTPUT"
          fi

          jq -Rnc '[inputs | split("\t")
                    | {repo: .[0], tag: .[1], pkg: .[2], suite: .[3], arch: .[4], version: .[5],
                       runner: (if .[4] == "arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end)}]' \
              < plan.tsv > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: plan
          path: plan.tsv
          retention-days: 7

  build:
    name: build / ${{ matrix.pkg }} / ${{ matrix.suite }} / ${{ matrix.arch }}
    needs: plan
    # Never on a pull request. The plan is the point; rebuilding the fleet on
    # every branch push is not, and publish sits behind this.
    if: needs.plan.outputs.has_work == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the packages repository at this package's tag
        # There is one repository now, and the row's first field is a package
        # name rather than an owner/repo slug, so the repository is named here
        # and the package selects a directory inside it below.
        uses: actions/checkout@v7
        with:
          repository: pkghaus/packages
          ref: ${{ matrix.tag }}
          path: pkg
          persist-credentials: false

      - name: Build and test this leg's package
        # The same action a packaging repository runs on its own tags, so a
        # package is built and DEP-8 tested identically in both places. It
        # matters that this one runs too: the archive rebuilds a tag whenever it
        # first needs it, sometimes weeks later, against whatever testing and
        # unstable have become since. That drift is invisible to the tag build.
        uses: pkghaus/action-debian-build@v1
        with:
          SUITE: ${{ matrix.suite }}
          WORKING_DIRECTORY: pkg/${{ matrix.pkg }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          # The real Debian filename: one leg builds exactly one plan row.
          name: ${{ matrix.pkg }}_${{ matrix.version }}_${{ matrix.arch }}.deb
          # Everything the builder collected, not just the .deb. The
          # .buildinfo beside it records the exact environment the package was
          # built in, which is what makes "built from source" checkable by
          # someone else. aptly has no use for it -- it is published to its own
          # R2 prefix below -- but it has to survive the artifact boundary first.
          path: pkg/${{ matrix.pkg }}/debs/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # Runs even when build was skipped: the pool index and keyring are
    # re-rendered idempotently, and the commit step no-ops when nothing
    # changed. Only a failed or cancelled upstream job stops a publish.
    needs: [plan, build]
    #
    # github.event_name is the load-bearing clause. Without it this is TRUE on a
    # pull request -- plan succeeds, build is skipped, and skipped is in the
    # list -- so a pull request would publish to the live archive.
    if: >-
      ${{ !cancelled()
          && github.event_name != 'pull_request'
          && needs.plan.result == 'success'
          && contains(fromJSON('["success", "skipped"]'), needs.build.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch archive state
        uses: ./.github/actions/fetch-state-branch
        with:
          branch: archive
          path: public

      # aptly's leveldb, and only that. Its package pool is a second copy of
      # every published .deb and is deliberately thrown away each run: at the
      # root publish prefix aptly reads the pool only for packages whose
      # objects are missing from the bucket, which is none of them except the
      # ones this run just built.
      #
      # Kept off the archive branch because that whole branch is uploaded as
      # the Worker's asset set, and this is a leveldb, not a web page.
      #
      # A missing branch is fatal here exactly as it is in the plan job; the
      # action says why.
      - name: Fetch aptly state
        uses: ./.github/actions/fetch-state-branch
        with:
          branch: aptly
          path: aptly-state

      - name: Download built packages
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: '*.deb'
          path: build
          merge-multiple: true

      - name: Install aptly
        uses: ./.github/actions/install-aptly

      - name: Import the archive signing key
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
        run: |
          printf '%s' "$ARCHIVE_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Include and publish to R2
        if: needs.build.result == 'success'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.PKGHAUS_APT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PKGHAUS_APT_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: scripts/ingest.sh include build

      # Beside aptly, not through it: aptly cannot ingest a .buildinfo, and one
      # placed in pool/ by hand is deleted by its next cleanup. Same condition
      # as the include above, because it publishes what that build produced.
      - name: Publish the buildinfos
        if: needs.build.result == 'success'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.PKGHAUS_APT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PKGHAUS_APT_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: scripts/publish-buildinfo.sh build

      # Unconditional, including on an empty plan. Gating this on "did we
      # publish anything" made a failed mirror unrepairable: the step runs
      # after the publish, so a failure leaves the archive published, the run
      # red, and the mirror behind -- and re-running then finds nothing to
      # build, skips the build job, and skips this step on the same
      # condition. The next real publish was the earliest repair, which could
      # be weeks. `aws s3 sync` is additive and idempotent, so running it
      # every time costs two LIST calls over ~150 objects and makes the
      # mirror self-healing instead.
      - name: Mirror the pool to the backup bucket
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.PKGHAUS_APT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PKGHAUS_APT_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: scripts/backup-pool.sh

      - name: Export the public keyring alongside the archive
        run: gpg --export > public/pkghaus-archive-keyring.gpg

      # After include (so the diff sees the new state), before render
      # (so the news page reflects this publish). Runs on empty plans
      # too: notices still merge, and an unchanged set emits nothing.
      - name: Update the news log
        run: scripts/news.sh

      - name: Render the pool index
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.PKGHAUS_APT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PKGHAUS_APT_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: scripts/render-index.sh

      # One stamp for both state commits. They record a single publish, and
      # two date(1) calls a second apart would claim otherwise.
      - name: Stamp this publish
        id: stamp
        run: echo "at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      # Committed through the API rather than with git push, so GitHub signs
      # it. The author becomes github-actions[bot]; nothing here invents an
      # identity, and no signing key has to reach the runner.
      - name: Commit archive state
        uses: pkghaus/signed-commit@v1
        with:
          workdir: public
          branch: archive
          message: Ingest ${{ steps.stamp.outputs.at }}
          token: ${{ github.token }}

      - name: Discard what the aptly branch must not carry
        run: |
          rm -f aptly-state/aptly.conf   # written per run, carries the R2 credentials
          rm -rf aptly-state/pool        # this run's .debs; the bucket has them now

      - name: Commit aptly state
        uses: pkghaus/signed-commit@v1
        with:
          workdir: aptly-state
          branch: aptly
          message: Ingest ${{ steps.stamp.outputs.at }}
          token: ${{ github.token }}

      # public/ is a clone, so it carries .git, and wrangler publishes the
      # whole directory as static assets. A served .git reconstructs the
      # working tree. Placed here because the commit steps above need that
      # .git to compute their diffs and nothing after them does.
      - name: Drop the clone's git metadata before publishing it
        run: rm -rf public/.git

      # The only publish step now. apt.pkg.haus is this Worker: the tree above
      # as static assets, pool objects and indices from R2, and the archive's
      # own 404.html for everything else. Nothing sits behind the route.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - name: Resolve the D1 database
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_APT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "pkghaus-stats") | .uuid')"
          if [ -z "$id" ]; then
            echo "::error title=D1 database missing::pkghaus-stats does not exist in this account."
            exit 1
          fi
          sed -i "s/PLACEHOLDER_RESOLVED_IN_CI/$id/" wrangler.toml

      # The stats page cannot mention a package nobody has downloaded: its table
      # is built from `downloads`, which only gains a row when a .deb is served.
      # This mirrors the archive's package set into the `packages` table the
      # reader unions against. news.sh rewrote known-packages.tsv earlier in
      # this job, so it is current.
      #
      # continue-on-error DELIBERATELY. The archive's publish path must not be
      # blocked by a cosmetic surface: if this fails the page falls back to
      # listing only packages with recorded downloads, which is exactly today's
      # behaviour. The failure is still annotated on the run rather than
      # swallowed, and the next publish retries it.
      #
      # Needs D1 *edit* on PKGHAUS_APT_CLOUDFLARE_API_TOKEN. Everything else
      # here only runs `wrangler d1 list`, which is a read, and the Worker's own
      # counter writes go through its runtime binding rather than the token.
      - name: Sync the package inventory into D1
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_APT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../scripts/sync-package-inventory.sh ../public/news/known-packages.tsv

      - name: Deploy the Worker and its assets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_APT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # public/ is the tree rendered and committed above, so the assets match
        # the archive branch this run just wrote.
        run: npx wrangler deploy

      # Ordered after the deployment on purpose: purging first would let the
      # edge refill with the previous render for a full day.
      - name: Purge the rebuilt pool objects from the edge cache
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.PKGHAUS_APT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PKGHAUS_APT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PKGHAUS_APT_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: scripts/purge-cache.sh
