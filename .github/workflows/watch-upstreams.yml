name: Watch upstream releases

# Turns scripts/watch-upstreams.sh into a single issue, rewritten in
# place. Detection only: it never edits a packaging repo, because a bump
# often needs packaging changes (a new build dependency, a lockfile that
# no longer compiles, a runtime dependency only a functional test finds)
# and the ingest fires on a signed tag CI cannot produce.
#
# Scheduled rather than event-driven: the release happens in a repo we do
# not control. It lives here rather than in each packaging repo because
# GitHub disables scheduled workflows after 60 days of repository
# inactivity, which would switch the watcher off in exactly the quiet
# repos that need it.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-upstreams
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check upstreams
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        # Exit 1 is drift and exit 2 is a failed lookup; both are
        # reportable outcomes rather than workflow failures. Anything
        # else is a real error and stops the run.
        run: |
          set +e
          report="$(scripts/watch-upstreams.sh)"
          status=$?
          set -e
          if [ "$status" -gt 2 ]; then
              echo "$report"
              echo "watch-upstreams.sh failed with status $status" >&2
              exit "$status"
          fi
          echo "$report"
          {
              echo "status=$status"
              echo 'report<<REPORT_EOF'
              echo "$report"
              echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATUS: ${{ steps.check.outputs.status }}
          REPORT: ${{ steps.check.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # A mention notifies only in newly created content, so it belongs in
          # the opening body and in the change comment, and nowhere else. Being
          # mentioned also subscribes the team to the issue, which is what makes
          # the closing comment reach them without mentioning them again.
          MENTION: '@pkghaus/maintainers'
        run: |
          title='Upstream release drift'
          # Exact title match, not a search query: search is fuzzy and
          # would eventually latch onto the wrong issue.
          number="$(gh issue list --repo "$REPO" --state open \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"

          if [ "$STATUS" = "0" ]; then
              if [ -n "$number" ]; then
                  gh issue close "$number" --repo "$REPO" \
                      --comment "Every enrolled package now matches its newest upstream release. Checked by $RUN_URL"
                  echo "closed #$number"
              else
                  echo "nothing to report"
              fi
              exit 0
          fi

          # Markers, so the report can be compared across runs without the run
          # URL below it counting as a change: that URL differs every run and
          # would otherwise comment on every one.
          body="$(printf '%s\n<!-- report -->\n%s\n<!-- /report -->\n\nChecked by %s. Reproduce by running scripts/watch-upstreams.sh\n\nBumps are deliberately manual: the ingest fires on a signed tag, and a version bump often needs packaging changes that only a build and a functional smoke test reveal.\n' \
              "$MENTION" "$REPORT" "$RUN_URL")"

          if [ -z "$number" ]; then
              gh issue create --repo "$REPO" --title "$title" --body "$body"
              echo "opened the drift issue"
              exit 0
          fi

          # An issue is already open. Editing its body is silent: GitHub only
          # notifies for a mention in newly created content, so a package
          # joining the list while another is outstanding would reach nobody.
          # Comment when the list actually changes, and only then.
          previous="$(gh issue view "$number" --repo "$REPO" --json body --jq .body \
              | sed -n '/<!-- report -->/,/<!-- \/report -->/p' | sed '1d;$d')"

          gh issue edit "$number" --repo "$REPO" --body "$body"

          if [ "$previous" = "$REPORT" ]; then
              echo "updated #$number, list unchanged"
          else
              gh issue comment "$number" --repo "$REPO" \
                  --body "$(printf 'The drift list changed. %s\n\n%s\n\nChecked by %s\n' "$MENTION" "$REPORT" "$RUN_URL")"
              echo "updated #$number and commented: the list changed"
          fi

      # The ingest checks this too, but the ingest is event-driven: a fleet
      # with no new tags for a quarter can pass through the entire 90-day
      # warning window without ever running it, and the first signal would be
      # every apt client rejecting the archive. This is the scheduled job that
      # exists whether or not anything was released, so it carries the check
      # that must not depend on activity, and it fails rather than warns --
      # an annotation on a cron run nobody opens is not a signal.
      #
      # Reads the PUBLISHED keyring, so no secret is needed in a second
      # workflow, and the fetch doubles as the only recurring check that the
      # archive is reachable at all.
      - name: Check signing-key expiry
        if: ${{ !cancelled() }}
        run: |
          curl --fail-with-body -sS --max-time 30 \
            -o published-keyring.gpg \
            https://apt.pkg.haus/pkghaus-archive-keyring.gpg
          FAIL_ON_WARN=1 scripts/check-key-expiry.sh published-keyring.gpg
