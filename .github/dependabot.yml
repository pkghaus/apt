version: 2

updates:
  # Every action here is actions/* or pkghaus/* on a major tag, deliberately,
  # so this proposes major bumps only. The linters CI runs are pinned by image
  # digest in run: steps, which no ecosystem below covers; bump those by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # wrangler is pinned exactly and runs with a token that can deploy the worker
  # serving pool/ and dists/. Pinning is what stops it changing on its own;
  # this is what stops it going stale.
  #
  # The directory is /worker, not /. A config saying `directory: /` where the
  # package.json is not at the root finds nothing and reports nothing, so the
  # gap reads exactly like coverage. Check the path, not the presence.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
