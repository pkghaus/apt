name: Install aptly
description: >-
  Install a pinned aptly release binary. Pinned rather than taken from the
  runner's distribution because the archive's on-disk database format and its
  published layout are decided by whichever aptly writes them, and the runner
  image bumps its own package on its own schedule.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        APTLY_VERSION: 1.6.3
        APTLY_SHA256: 535ed24eb706bc25a316b59d709a7e74e10165f2ffab8552097ba7e4816a3e7e
      run: |
        zip="aptly_${APTLY_VERSION}_linux_amd64"
        curl -fsSLo /tmp/aptly.zip \
            "https://github.com/aptly-dev/aptly/releases/download/v${APTLY_VERSION}/${zip}.zip"
        echo "${APTLY_SHA256}  /tmp/aptly.zip" | sha256sum -c -
        sudo unzip -q -j -o /tmp/aptly.zip "${zip}/aptly" -d /usr/local/bin
        sudo chmod +x /usr/local/bin/aptly
        aptly version
